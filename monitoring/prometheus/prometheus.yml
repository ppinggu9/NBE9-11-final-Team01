# 배치 경로: monitoring/prometheus/prometheus.yml

global:
    scrape_interval: 15s
    scrape_timeout: 10s

scrape_configs:
    # 로컬 앱(IDE/gradle, :8080) 스크랩
    - job_name: 'snaptix-local'
      metrics_path: /actuator/prometheus
      static_configs:
          - targets: ['host.docker.internal:8080']
            labels:
                instance: 'local-app'

    - job_name: 'snaptix-prod'
      scheme: https
      metrics_path: /actuator/prometheus
      basic_auth:
          username: snaptix-metrics                        # 리터럴(비밀 아님, NPM 자격과 동일)
          password_file: /etc/prometheus/secrets/prom_pass # ← 비밀번호는 파일로
      static_configs:
          - targets: ['metrics58546.example-test-domain11.shop']               # 호스트명(비밀 아님)
            labels:
                instance: 'prod-app'

