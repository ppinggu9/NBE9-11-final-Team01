# 배치 경로: monitoring/docker-compose.monitoring.yml
#
# 로컬 모니터링 스택 (Prometheus + Grafana) — PR-C
# 기존 docker-compose.yml(mysql/redis)와 분리 운용. 앱은 호스트(IDE/gradle, :8080)에서 실행.
#
# 실행:   docker compose -f docker-compose.monitoring.yml up -d
# 종료:   docker compose -f docker-compose.monitoring.yml down
# (이미지 태그는 환경에 맞게 고정/조정하세요)

services:
    prometheus:
        image: prom/prometheus:v3.5.4
        container_name: snaptix-prometheus
        ports:
            - "9090:9090"
        volumes:
            - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
            - ./prometheus/secrets/prom_pass:/etc/prometheus/secrets/prom_pass:ro
            - prometheus_data:/prometheus
        command:
            - --config.file=/etc/prometheus/prometheus.yml
            - --storage.tsdb.retention.time=15d
        # Linux 에서 호스트(앱) 접근용. Docker Desktop(Mac/Win)은 host.docker.internal 기본 지원.
        #        extra_hosts:
        #            - "host.docker.internal:host-gateway"
        restart: unless-stopped

    grafana:
        image: grafana/grafana:13.1.0
        container_name: snaptix-grafana
        ports:
            - "3000:3000"
        environment:
            GF_SECURITY_ADMIN_USER: admin
            GF_SECURITY_ADMIN_PASSWORD: admin        # 로컬 전용 기본값 — 운영 노출 금지
            GF_USERS_ALLOW_SIGN_UP: "false"
        volumes:
            - ./grafana/provisioning:/etc/grafana/provisioning:ro
            - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
            - grafana_data:/var/lib/grafana
        depends_on:
            - prometheus
        restart: unless-stopped

volumes:
    prometheus_data:
    grafana_data:
