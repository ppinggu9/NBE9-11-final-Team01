spring:
    application:
        name: snaptix

    profiles:
        active: local  # 운영은 app.env로 SPRING_PROFILES_ACTIVE=dev주입
        include: secret

    datasource:
        # connectionTimeZone=SERVER : JDBC가 MySQL 서버에 세션 시간대를 직접 물어봐서(SELECT
        # @@session.time_zone 상당) 변환 기준으로 삼는다. serverTimezone(레거시 파라미터, 값 고정)이나
        # 파라미터 미지정(기본값 connectionTimeZone=LOCAL, "서버가 JVM 클라이언트와 같은 시간대"라고
        # 그냥 가정)은 둘 다 위험하다 — 실제로 파라미터를 제거하고 테스트해보니 LOCAL 기본값이
        # 개발자 PC의 JVM 시간대(Asia/Seoul)를 서버 시간대로 잘못 가정해, DB(UTC)의 CURRENT_TIMESTAMP
        # 값을 9시간 과거로 해석하는 회귀가 재현됨(ReservationRepositoryTimezoneTest 실패,
        # drift=PT8H59M59S). serverTimezone=Asia/Seoul로 고정했던 기존 설정도 같은 이유로 틀렸었다.
        # SERVER 모드는 로컬 개발 PC의 시간대나 DB 컨테이너의 TZ 설정과 무관하게 항상 정확하다.
        # (reservations.created_at DEFAULT CURRENT_TIMESTAMP → HoldExpiryWorker 5분 홀드 만료 판정
        # 버그, order-load 부하테스트 2026-07-01, 이슈 #359 하위 이슈 참고)
        url: jdbc:mysql://localhost:3306/snaptix?useSSL=false&allowPublicKeyRetrieval=true&characterEncoding=UTF-8&connectionTimeZone=SERVER&rewriteBatchedStatements=true
        username: ${SPRING_DATASOURCE_USERNAME:snaptix}
        password: ${SPRING_DATASOURCE_PASSWORD:snaptix1234}
        driver-class-name: com.mysql.cj.jdbc.Driver

    exposed:
        generate-ddl: true

    data:
        redis:
            host: ${SPRING_DATA_REDIS_HOST:localhost}
            port: ${SPRING_DATA_REDIS_PORT:6379}
            password: ${SPRING_DATA_REDIS_PASSWORD:}

server:
    port: 8080

app:
    cookie:
        secure: false

springdoc:
    swagger-ui:
        path: /swagger-ui.html

resilience4j:
    circuitbreaker:
        instances:
            redis:
                sliding-window-type: COUNT_BASED
                sliding-window-size: 10
                failure-rate-threshold: 50
                slow-call-duration-threshold: 2s
                slow-call-rate-threshold: 80
                wait-duration-in-open-state: 15s # 10s일 경우 너무 빨리 닫혀서 에러
                permitted-number-of-calls-in-half-open-state: 10 # 3일 경우 너무 적어서 half-open와 자기자신 circuitbreak에 걸림
                automatic-transition-from-open-to-half-open-enabled: true
                record-failure-predicate: com.develop.snaptix.global.aop.aspect.RedisExceptionPredicate
                ignore-exceptions:
                    - com.develop.snaptix.global.exception.BusinessException

alert:
    slack:
        enabled: false
        webhook-url: ${SLACK_WEBHOOK_URL:}
        channel: ${SLACK_CHANNEL:#ticketing-redis-alerts}
        mention-on-critical: false
    throttle:
        window-seconds: 300

event:
    cleanup:
        cron: "0 0 * * * *"   # 고아 키 스윕 1시간 주기 (백스톱)
        window: 1d            # 대상 = CLOSED & updated_at >= now - window (다운타임 커버)
        ttl: 1h               # CLOSED 정리 시 claimed/stock 백스톱 TTL (자가 만료)
        ttl-jitter: 0.1       # TTL ±10% 지터 (동시 만료 snowstorm 분산)

# Rebuild & Reconcile (Epic 13)
reconcile:
    hold-window: 5m          # 유효 점유 홀드 윈도우 (cutoff = now - holdWindow)
    scheduler-cron: "0 */10 * * * *"   # 만료 정산 10분 주기 (Story 13.3-2차)
    drift-cron: "0 */30 * * * *"       # 상시 드리프트 정산 30분 주기 (Story 13.4)
    rebuild-lock-ttl: 5m     # 다중 인스턴스 단일 재구축 락 TTL
    drift-chunk-size: 500   # 청크단위

management:
    endpoints:
        web:
            exposure:
                include: health,info,metrics,prometheus
    endpoint:
        health:
            probes:
                enabled: true
            show-details: never
    metrics:
        tags:
            application: snaptix
            env: ${spring.profiles.active}

realtime:
    sse:
        timeout: 8m
        heartbeat-interval: 30s

snaptix:
    redis:
        ttl:
            ingest-envelope: 8m       # 멱등/소유권 봉투(권장 8분, 부하테스트로 조정)
            order-hold: 5m            # ORDER_HOLD = 워커 재앵커링 기준
            webhook-processed: 10m
            payment-approve: 60s
            event-info: 1h            # Story 1.1 / 11.2 / 13.2 일치
            order-pending: 2m
            rate-limit-second: 1s
            rate-limit-minute: 60s
    rate-limit:
        # 사용자(userId) 기준 — 기존 IP 전용 한도값(5/20)을 그대로 승계, "1인당" 실질 한도
        user-per-second: 5
        user-per-minute: 20
        # IP 기준 — 공유 IP(NAT/사내망/부하테스트)에서 다수의 정상 사용자가 몰려도 오탐 429가
        # 나지 않도록 사용자 한도보다 넉넉하게. 비인증 단계까지 포함하는 최소 방어선.
        # 제안값이며 실제 트래픽 패턴에 맞춰 팀 정책으로 조정 필요.
        ip-per-second: 30
        ip-per-minute: 300

payment:
    mock:
        webhook:
            secret: ${MOCK_PAYMENT_WEBHOOK_SECRET:snaptix-local-mock-webhook-secret}

order:
    stream:
        consumer-group: order-workers
        trim:
            enabled: true
            fixed-delay: 3m
    consumer:
        claim-idle-ms: 30000   # PEL 회수 기준 유휴 시간 (p99 처리시간보다 크게)
        claim-schedule-ms: 10000  # 회수 스케줄 주기
    hold:
        timeout-minutes: 5                  # ORDER_HOLD TTL 기준 (snaptix.redis.ttl.order-hold 와 일치)
        scheduler-fixed-delay-ms: 60000    # 배치 주기 — 1분 (fixedDelay: 이전 실행 완료 후 대기)
        batch-size: 100                     # 단일 배치 최대 처리 건수 (대량 만료 방어)
        keyspace-listener:
            enabled: false
